# Compose demo for Block 6: "externalise the state".
#
# Two services: the todo app and a Postgres container next to it. The app is
# switched from "SQLite in a volume" to "Postgres container" purely through
# env vars (DB_DRIVER + DATABASE_URL), which the entrypoint writes into the
# config file. Nothing in the app code changes.
#
#   APP_PORT=8080 docker compose up --build       # APP_PORT defaults to 8080
#
# Then open http://localhost:${APP_PORT:-8080} — the data now lives in Postgres,
# not in a local SQLite file. APP_PORT lets each user pick their own host port on a
# shared machine; the container always listens on 8080.

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      COMPANY_NAME: "Inqbeo (Postgres)"
      DB_DRIVER: "postgres"
      DATABASE_URL: "postgres://todo:todo@db:5432/todo?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

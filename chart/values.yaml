# Default values for the Inqbeo "todo" chart.
# This file is heavily commented because it doubles as course material.

# -- Number of app replicas. Note: sessions are in-memory, so with >1 replica a
# user may be bounced to the login page when hitting a different pod (a teaching
# point for "why you externalise session state").
replicaCount: 1

image:
  repository: ghcr.io/inqbeo/containerization-demo-webapp
  # Image tag. Empty → use the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# Application configuration (these become env vars; docker-entrypoint.sh turns
# them into the config.yaml the app reads).
# ----------------------------------------------------------------------------
app:
  companyName: "Inqbeo"
  # UI skin: coral | navy | dark
  theme: coral
  logLevel: info
  auth:
    username: admin
    # Password handling, in order of precedence:
    #   1. existingSecret — reference a Secret you manage (key = passwordKey).
    #   2. password       — set inline; the chart stores it in a generated Secret.
    #   3. neither        — the app generates a random password on first start
    #                       and prints it once to the log (kubectl logs ...).
    # Remember: the app hashes the password into the database on first start and
    # then FREEZES it — changing this later has no effect once the DB exists.
    existingSecret: ""
    passwordKey: password
    password: ""

# ----------------------------------------------------------------------------
# Database backend
# ----------------------------------------------------------------------------
database:
  # Which backend the app uses: "sqlite" or "postgres".
  type: sqlite

  # Timeout for the app's INITIAL database connection at startup (Go duration,
  # e.g. "5s"). Bounds the connect attempt so an unreachable database (a
  # NetworkPolicy blocking egress, a wrong host, Postgres not up yet) fails fast
  # and is logged, instead of hanging until a probe restarts the Pod into
  # CrashLoopBackOff with empty logs. Applies to both sqlite and postgres.
  connectTimeout: "5s"

  # ---- SQLite (database.type=sqlite) ----
  # A single file on a PersistentVolume. Simple; not shared across replicas.
  sqlite:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      # Use an existing PVC instead of creating one.
      existingClaim: ""

  # ---- Postgres (database.type=postgres) ----
  postgres:
    # "internal" → the chart deploys a Postgres next to the app.
    # "external" → use an existing database (e.g. CloudNativePG) via a Secret.
    mode: internal

    # --- internal Postgres (mode=internal) ---
    internal:
      image: postgres:16-alpine
      auth:
        username: todo
        database: todo
        # Password for the in-chart Postgres. If existingSecret is empty and
        # password is empty, the chart generates one and keeps it stable across
        # upgrades (via a lookup of the existing Secret).
        existingSecret: ""
        passwordKey: password
        password: ""
      persistence:
        enabled: true
        size: 2Gi
        storageClass: ""
      resources: {}

    # --- external Postgres (mode=external) ---
    # Point at an existing Secret holding the DB credentials. CloudNativePG
    # creates an "app" Secret (e.g. "<cluster>-app", type kubernetes.io/basic-auth)
    # containing a ready-to-use connection "uri" plus host/port/user/password/
    # dbname. We read everything from that Secret — no DB credentials in values.
    external:
      # Name of the existing Secret (REQUIRED for mode=external).
      existingSecret: ""
      # Preferred: a full connection URI in the Secret (CNPG key: "uri").
      # Set uriKey to "" to instead assemble the DSN from the individual keys below.
      uriKey: uri
      # Used only when uriKey is empty:
      hostKey: host
      portKey: port
      userKey: username
      passwordKey: password
      dbnameKey: dbname
      sslmode: require

# ----------------------------------------------------------------------------
# Service
# ----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  # The container always listens on 8080.
  targetPort: 8080
  annotations: {}

# ----------------------------------------------------------------------------
# Ingress (classic Ingress API)
# ----------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: todo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: todo-tls
  #    hosts:
  #      - todo.example.com

# ----------------------------------------------------------------------------
# Route (OpenShift) — alternative to Ingress on OpenShift/OKD clusters
# ----------------------------------------------------------------------------
# OpenShift can also create a Route for you from an Ingress, but a native Route
# gives you direct control over TLS termination and the router-specific
# annotations (haproxy.router.openshift.io/...).
route:
  enabled: false
  # Hostname for the Route. Leave empty and OpenShift generates one for you:
  # <route-name>-<namespace>.<cluster apps domain>.
  host: ""
  # Optional path prefix. Only valid for http/https (non-passthrough) routes.
  path: ""
  # Router annotations, e.g.:
  #   haproxy.router.openshift.io/timeout: 60s
  #   haproxy.router.openshift.io/balance: roundrobin
  annotations: {}
  # None | Subdomain
  wildcardPolicy: None
  tls:
    # false → plain HTTP Route (no TLS section at all).
    enabled: true
    # edge        — the router terminates TLS, talks HTTP to the pod (what this
    #               app wants: it serves plain HTTP on 8080).
    # passthrough — TLS goes straight to the pod (app would have to serve TLS).
    # reencrypt   — router terminates, then opens a new TLS connection to the pod.
    termination: edge
    # What to do with plain HTTP requests: None | Allow | Redirect.
    insecureEdgeTerminationPolicy: Redirect
    # Bring your own certificate (PEM). Leave empty to use the router's default
    # wildcard certificate — the usual choice for a course cluster.
    certificate: ""
    key: ""
    caCertificate: ""
    # Only for termination=reencrypt: CA the router uses to trust the pod.
    destinationCACertificate: ""

# ----------------------------------------------------------------------------
# HTTPRoute (Gateway API) — alternative to Ingress
# ----------------------------------------------------------------------------
httpRoute:
  enabled: false
  # The Gateway(s) this route attaches to.
  parentRefs:
    - name: ""
      # namespace: gateway-system
      # sectionName: https
  hostnames:
    - todo.example.com
  annotations: {}

# ----------------------------------------------------------------------------
# Health probes (the app exposes GET /healthz)
# ----------------------------------------------------------------------------
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 10

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 10001
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

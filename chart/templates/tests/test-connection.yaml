apiVersion: v1
kind: Pod
metadata:
  name: {{ include "todo.fullname" . }}-test-healthz
  labels:
    {{- include "todo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: healthz
      image: curlimages/curl:8.11.0
      command: ["curl", "-fsS"]
      args: ["http://{{ include "todo.fullname" . }}:{{ .Values.service.port }}/healthz"]

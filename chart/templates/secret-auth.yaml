{{- /* The chart manages the login password Secret only when an inline password
       is given and no existingSecret is referenced. When neither is set, the app
       generates one on first start (read it from the pod log). */ -}}
{{- if and .Values.app.auth.password (not .Values.app.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo.authSecretName" . }}
  labels:
    {{- include "todo.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.app.auth.password | quote }}
{{- end }}

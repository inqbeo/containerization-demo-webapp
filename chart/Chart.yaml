apiVersion: v2
name: todo
description: |
  Inqbeo "todo" demo app — the running example of the Inqbeo containerization &
  Kubernetes course. Deploys the app with SQLite, an in-chart Postgres, or an
  external (CloudNativePG-compatible) database, and optionally exposes it via an
  Ingress or a Gateway API HTTPRoute.
type: application

# Chart version — bump on every chart change (SemVer, no "v" prefix).
version: 0.1.2
# Application version — the container image tag this chart defaults to.
appVersion: "0.1.2"

home: https://github.com/inqbeo/containerization-demo-webapp
sources:
  - https://github.com/inqbeo/containerization-demo-webapp
maintainers:
  - name: Inqbeo GmbH
    url: https://inqbeo.de
keywords:
  - todo
  - demo
  - kubernetes
  - course
  - postgres
icon: https://raw.githubusercontent.com/inqbeo/containerization-demo-webapp/main/docs/img/icon.png

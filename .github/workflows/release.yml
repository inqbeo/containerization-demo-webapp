name: Release

# Triggered by pushing a SemVer tag WITHOUT a "v" prefix, e.g.:
#   git tag 0.1.0 && git push origin 0.1.0
#
# Publishes:
#   * the container image to GHCR (multi-arch), tagged with the version + latest
#   * the Helm chart to GHCR as an OCI artifact
#   * the Helm chart to the GitHub Pages Helm repo (classic `helm repo add`)
#
# Push the first tag (0.1.0) only once everything is known to work.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io

permissions:
  contents: write   # push to gh-pages
  packages: write   # push to GHCR

jobs:
  # ---------------------------------------------------------------------------
  # Container image → GHCR (linux/amd64 + linux/arm64; both pure-Go drivers).
  # ---------------------------------------------------------------------------
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Helm chart → GHCR (OCI) + GitHub Pages Helm repo.
  # ---------------------------------------------------------------------------
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/v3.16.3/scripts/get-helm-3 | DESIRED_VERSION=v3.16.3 bash

      - name: Resolve version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Package chart (version pinned to the release tag)
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          mkdir -p .deploy
          helm package chart \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination .deploy

      - name: Push chart to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          helm push ".deploy/todo-${{ steps.v.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

      - name: Publish chart to GitHub Pages Helm repo
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages origin/gh-pages
          else
            git worktree add --orphan gh-pages
          fi
          cp .deploy/todo-${{ steps.v.outputs.version }}.tgz gh-pages/
          # (Re)build index over all packages present in the branch.
          helm repo index gh-pages --url "$PAGES_URL"
          if [ ! -f gh-pages/index.html ]; then
            printf '<!doctype html><meta charset="utf-8"><title>Inqbeo Helm charts</title><h1>Inqbeo Helm charts</h1><pre>helm repo add inqbeo %s\nhelm install todo inqbeo/todo</pre>\n' "$PAGES_URL" > gh-pages/index.html
          fi
          cd gh-pages
          git add -A
          git commit -m "Publish todo chart ${{ steps.v.outputs.version }}" || echo "nothing to commit"
          git push origin HEAD:gh-pages

name: Release

# Triggered by pushing a SemVer tag WITHOUT a "v" prefix, e.g.:
#   git tag 0.1.0 && git push origin 0.1.0
#
# Publishes (both to GHCR — one registry for image and chart):
#   * the container image (multi-arch), tagged with the version + latest
#   * the Helm chart as an OCI artifact (oci://ghcr.io/inqbeo/charts/todo)
#
# The packages are private until you make them public once in the GitHub UI
# (Org → Packages → the package → Package settings → Change visibility → Public).
#
# Push the first tag (0.1.0) only once everything is known to work.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write   # push image + chart to GHCR

jobs:
  # ---------------------------------------------------------------------------
  # Container image → GHCR (linux/amd64 + linux/arm64; both pure-Go drivers).
  # ---------------------------------------------------------------------------
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Helm chart → GHCR (OCI artifact, same registry as the image).
  # ---------------------------------------------------------------------------
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/v3.16.3/scripts/get-helm-3 | DESIRED_VERSION=v3.16.3 bash

      - name: Resolve version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Package chart (version pinned to the release tag)
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          mkdir -p .deploy
          helm package chart \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination .deploy

      - name: Push chart to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          helm push ".deploy/todo-${{ steps.v.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
          echo "Pushed oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/todo:${{ steps.v.outputs.version }}"
